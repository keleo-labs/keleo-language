# Server-side backstop for the local pre-commit hooks.
#
# The difference that matters: these jobs scan FULL HISTORY, not the staged
# diff. That is what catches a secret committed before the hooks existed, or
# pushed by someone who bypassed them.
#
# fetch-depth: 0 is required. The default shallow clone gives the scanners one
# commit to look at, which quietly reduces this to the same scope as the hook.
#
# gitleaks runs from its release binary rather than gitleaks-action, because
# that action requires a paid licence key for organisation-owned repositories
# and keleo-labs is an organisation. The scanner itself is MIT licensed; only
# the Action wrapper is not. The version is pinned to match the rev in
# .pre-commit-config.yaml so local and CI cannot disagree about what a leak is.

name: secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
      - name: gitleaks (full history)
        run: ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: trufflehog (verified only)
        uses: trufflesecurity/trufflehog@main
        with:
          # The action supplies --fail and --no-update itself. Passing either
          # here makes the flag repeat, which trufflehog rejects outright --
          # the scan then never runs and the job fails looking like a finding.
          extra_args: --only-verified
